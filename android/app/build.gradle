plugins {
    id 'com.android.application'
}

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.example.lessonapp"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            // expects these to be provided via android/gradle.properties or -P properties in CI
            storeFile file('key.jks')
            storePassword project.hasProperty('KEYSTORE_PASSWORD') ? project.property('KEYSTORE_PASSWORD') : ''
            keyAlias project.hasProperty('KEY_ALIAS') ? project.property('KEY_ALIAS') : ''
            keyPassword project.hasProperty('KEY_PASSWORD') ? project.property('KEY_PASSWORD') : ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // use signing config when available
            if (project.hasProperty('KEYSTORE_PASSWORD') && file('key.jks').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
